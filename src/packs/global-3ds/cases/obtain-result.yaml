id: obtain-result
name: "Obtain the authentication result — GET /authentications/{id}/result"
scenario: "Call GET /authentications/{id}/result."
required: true
source: actions
observability: polling
tags:
  - 3ds
  - action-type-documented
mode: latest
# Action type taken from GP developer documentation examples.
# Required to pass the liability-shift data into the sale.
matcher:
  type: GET_CHALLENGE_RESULT
  resource: AUTHENTICATIONS
expect:
  latest:
    responseCodeIn:
      - "200"
      - "201"
evaluator:
  type: declarative
